<section id="room3d-animation-controls" class="workspace-timeline" aria-label="Explore sunlight over time" data-state="idle">
  <div class="timeline-heading"><div class="timeline-date"><label for="selected-date-input">Date</label><input id="selected-date-input" type="date" name="selected_date" value="{{ form_values.selected_date }}"><span id="example-label" class="example-badge">Example day · 2025</span></div><button id="set-now-button" type="button" class="quiet-button">Use current time</button></div>
  <div class="timeline-track"><button id="room3d-play" type="button" class="play-button" aria-pressed="false" disabled>Play day</button><div class="timeline-range"><label class="sr-only" for="room3d-time-slider">Time of day</label><input id="room3d-time-slider" class="room3d-time-slider" type="range" min="0" max="143" value="60" step="1" aria-label="Sunlight animation time" aria-valuetext="{{ form_values.selected_time }}"><div id="daylight-markers" class="daylight-markers" aria-hidden="true"><span id="sunrise-marker" class="daylight-marker">Sunrise</span><span id="sunset-marker" class="daylight-marker">Sunset</span></div></div><label class="timeline-clock"><span class="sr-only">Selected time</span><input id="selected-time-input" type="time" name="selected_time" value="{{ form_values.selected_time }}"></label></div>
  <div class="timeline-foot"><span id="time-scrubber-reference">{{ form_values.timezone_name }}</span><div class="timeline-presets" role="group" aria-label="Sunlight time presets"><button type="button" class="quiet-button" data-room3d-time-preset="morning" aria-pressed="false" disabled>Morning</button><button type="button" class="quiet-button" data-room3d-time-preset="noon" aria-pressed="false" disabled>Solar noon</button><button type="button" class="quiet-button" data-room3d-time-preset="evening" aria-pressed="false" disabled>Evening</button></div></div>
  <span id="room3d-animation-status" class="sr-only" role="status">Loading the day.</span>
  <output id="room3d-time-readout" class="sr-only" for="room3d-time-slider">{{ form_values.selected_time }}</output>
  <input id="day-of-year-slider" type="hidden" value="15"><input id="time-of-day-slider" type="hidden" value="600"><span id="day-of-year-readout" hidden></span><span id="time-of-day-readout" hidden></span>
</section>
